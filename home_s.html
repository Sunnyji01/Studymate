
<!DOCTYPE html>
<html lang="hi" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GOD SUNNY</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Custom Keyframes aur Glow Effects */
    @keyframes auraPulse {
      0%, 100% {
        transform: scale(1) translate(0px, 0px);
        opacity: 0.45;
      }
      50% {
        transform: scale(1.15) translate(-15px, 20px);
        opacity: 0.75;
      }
    }

    @keyframes floatCard {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-12px);
      }
    }

    .animate-aura {
      animation: auraPulse 8s ease-in-out infinite;
    }

    .animate-float {
      animation: floatCard 5s ease-in-out infinite;
    }

    .god-glow {
      box-shadow: 0 0 50px -10px rgba(99, 102, 241, 0.4), 
                  0 0 100px -20px rgba(6, 182, 212, 0.3);
    }
  </style>
</head>
<body class="bg-[#030712] text-slate-100 min-h-screen flex items-center justify-center p-4 sm:p-8 overflow-hidden relative font-sans selection:bg-cyan-500 selection:text-black">

  <!-- Interactive Dynamic Background Canvas -->
  <canvas id="bgCanvas" class="fixed inset-0 w-full h-full pointer-events-none z-0 opacity-60"></canvas>

  <!-- Ambient Luxury Glow Orbs -->
  <div class="fixed top-1/4 -left-20 w-80 sm:w-[500px] h-80 sm:h-[500px] rounded-full bg-gradient-to-tr from-indigo-600/30 to-purple-600/20 blur-[120px] pointer-events-none animate-aura z-0"></div>
  <div class="fixed bottom-1/4 -right-20 w-80 sm:w-[500px] h-80 sm:h-[500px] rounded-full bg-gradient-to-bl from-cyan-500/25 to-emerald-500/20 blur-[130px] pointer-events-none animate-aura z-0" style="animation-delay: -4s;"></div>

  <!-- Main Center God Showcase Container -->
  <main class="relative z-10 w-full max-w-xl mx-auto flex flex-col items-center text-center animate-float">
    
    <!-- Top Minimal Tag -->
    <div class="inline-flex items-center gap-2.5 px-4 py-1.5 rounded-full border border-cyan-500/30 bg-slate-900/60 backdrop-blur-xl mb-6 shadow-lg shadow-cyan-950/50">
      <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-ping"></span>
      <span class="text-xs font-mono tracking-widest text-cyan-300 uppercase font-semibold">DIVINE PRESENCE // ONLINE</span>
    </div>

    <!-- Main Heading: GOD SUNNY -->
    <h1 class="text-5xl sm:text-7xl md:text-8xl font-black tracking-tighter uppercase mb-4 leading-none select-none">
      <span class="bg-gradient-to-r from-white via-cyan-200 to-indigo-400 bg-clip-text text-transparent drop-shadow-[0_10px_25px_rgba(6,182,212,0.3)]">
        GOD SUNNY
      </span>
    </h1>

    <!-- One-line Punchline Message -->
    <p class="text-slate-400 text-sm sm:text-base md:text-lg font-medium max-w-md mx-auto mb-8 tracking-wide leading-relaxed">
      Sabka baap, pure code ka vidhaata. No drama, sirf supreme swag aur unbeatable dominance.
    </p>

    <!-- Bada Sa Image Frame (Interactive Tilt Ready) -->
    <div id="imageCard" class="relative group w-full max-w-[340px] sm:max-w-[420px] md:max-w-[450px] aspect-[4/5] rounded-3xl p-1.5 bg-gradient-to-b from-cyan-500/50 via-indigo-500/20 to-purple-500/50 god-glow transition-all duration-300">
      
      <!-- Inner Glass Card Container -->
      <div class="relative w-full h-full rounded-[22px] overflow-hidden bg-slate-950 border border-slate-800/80 shadow-2xl">
        
        <!-- Badi Photo (Sunny ki Image) -->
        <img 
          id="godImage"
          src="https://i.ibb.co/5gVpgxBy/image.jpg" 
          alt="God Sunny Avatar" 
          class="w-full h-full object-cover object-center filter contrast-110 saturate-105 group-hover:scale-105 transition-transform duration-700 ease-out"
          onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1534972195531-a756b1126f24?w=800&auto=format&fit=crop&q=80';"
        />

        <!-- Subtle Gradient Vignette Over Image -->
        <div class="absolute inset-0 bg-gradient-to-t from-slate-950/90 via-slate-950/10 to-transparent pointer-events-none"></div>

        <!-- Sleek Bottom Watermark Label Inside Image -->
        <div class="absolute bottom-5 left-5 right-5 flex items-center justify-between pointer-events-none">
          <div class="text-left">
            <span class="text-[10px] tracking-[0.25em] text-cyan-400 font-mono font-bold uppercase block">SUPREME LEVEL</span>
            <span class="text-lg font-extrabold text-white tracking-wide">SUNNY</span>
          </div>
          <div class="px-3 py-1 rounded-lg bg-black/60 backdrop-blur-md border border-white/10 text-[11px] font-mono text-slate-300">
            100% UNTOUCHABLE
          </div>
        </div>

      </div>

      <!-- Cyber Corner Ornaments -->
      <div class="absolute -top-1.5 -left-1.5 w-4 h-4 border-t-2 border-l-2 border-cyan-400 rounded-tl pointer-events-none"></div>
      <div class="absolute -top-1.5 -right-1.5 w-4 h-4 border-t-2 border-r-2 border-cyan-400 rounded-tr pointer-events-none"></div>
      <div class="absolute -bottom-1.5 -left-1.5 w-4 h-4 border-b-2 border-l-2 border-indigo-400 rounded-bl pointer-events-none"></div>
      <div class="absolute -bottom-1.5 -right-1.5 w-4 h-4 border-b-2 border-r-2 border-indigo-400 rounded-br pointer-events-none"></div>
    </div>

  </main>

  <!-- Interactive Background Particles + 3D Tilt Script -->
  <script>
    // 1. Ambient Dynamic Stars/Particles Canvas
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function setupCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      particles = [];
      const particleCount = Math.floor((canvas.width * canvas.height) / 14000);
      for (let i = 0; i < particleCount; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 1.5 + 0.5,
          speedY: Math.random() * 0.4 + 0.1,
          alpha: Math.random() * 0.7 + 0.3
        });
      }
    }

    function renderParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#38bdf8';

      particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(56, 189, 248, ${p.alpha})`;
        ctx.fill();

        p.y -= p.speedY;
        if (p.y < 0) {
          p.y = canvas.height;
          p.x = Math.random() * canvas.width;
        }
      });
      requestAnimationFrame(renderParticles);
    }

    setupCanvas();
    renderParticles();
    window.addEventListener('resize', setupCanvas);

    // 2. Subtle 3D Mouse Parallax Tilt for the Image Card
    const card = document.getElementById('imageCard');

    window.addEventListener('mousemove', (e) => {
      const { innerWidth, innerHeight } = window;
      const x = (e.clientX - innerWidth / 2) / 35;
      const y = (e.clientY - innerHeight / 2) / 35;

      card.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;
    });

    window.addEventListener('mouseleave', () => {
      card.style.transform = `rotateY(0deg) rotateX(0deg)`;
    });
  </script>
</body>
</html>
